name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: unit + data tests (includes integrity manifest freshness)
        run: npm test
      - name: headers and policy sanity
        run: |
          grep -q "require-trusted-types-for 'script'" index.html
          ! grep -q "unsafe-inline" index.html
          test -f .well-known/security.txt
          test -f integrity.json
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
