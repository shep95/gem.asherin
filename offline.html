<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Uriel — offline</title>
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/uriel.css">
</head>
<body>
<div class="bg-l" aria-hidden="true"></div>
<div class="bg-ov" aria-hidden="true"></div>
<div class="shell">
  <header class="topbar"><span class="logo">Uriel</span><span class="logo-sub">gematria engine</span></header>
  <main id="main-area">
    <div class="m-empty">
      <div class="m-empty-g" aria-hidden="true">✦</div>
      <p class="m-empty-t">you are offline and the app has not been cached yet</p>
      <p class="drop-hint">open uriel once while online and it will work offline from then on</p>
      <p class="drop-hint"><a href="./">try again</a></p>
    </div>
  </main>
</div>
</body>
</html>
